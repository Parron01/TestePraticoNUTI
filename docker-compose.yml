version: "3.8"

services:
  db:
    image: postgres:15
    container_name: nutiapp-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: nuti_db
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-net

  backend:
    build:
      context: ./BACKEND
    container_name: nutiapp-backend
    restart: always
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/nuti_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: admin
    depends_on:
      - db
    networks:
      - app-net

  frontend:
    build:
      context: .
    container_name: nutiapp-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - app-net

volumes:
  db-data:

networks:
  app-net:
    external: true
